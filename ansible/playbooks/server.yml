---
- name: Install and configure nodes
  hosts: ubuntu_server
  gather_facts: true
  become: true
  vars_files:
    - ../vars/main.yml
    - ../vars/ubuntu.yml
    - ../vars/vault.yml
  tasks:
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/hardening
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/bash
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/filesystem
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/git
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/packages
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/packages
        tasks_from: fastfetch
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/docker
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/cron
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/taskfile-dev
    - ansible.builtin.include_role:
        name: ../roles/common/taskfile-dev
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/ansible
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/github-cli
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/virtualization
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/node
        tasks_from: main

- name: Install and configure nodes (non-root)
  hosts: ubuntu_server
  gather_facts: true
  become: false
  vars_files:
    - ../vars/main.yml
    - ../vars/ubuntu.yml
    - ../vars/vault.yml
  tasks:
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/atuin
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/cron
        tasks_from: jobs
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/docker
        tasks_from: scout
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/node
        tasks_from: modules-ai
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/claude

- name: Install and configure caprica specifics
  hosts: caprica.fritz.box
  gather_facts: true
  become: true
  vars_files:
    - ../vars/main.yml
    - ../vars/ubuntu.yml
  tasks:
    # Relies on {{ default_user }} having passwordless sudo (NOPASSWD: ALL), see
    # https://github.com/sommerfeld-io/configs-homelab/issues/160
    - name: Caprica  ----  Cron  ----  Add nightly shutdown
      ansible.builtin.cron:
        name: "nightly shutdown"
        minute: "0"
        hour: "1"
        job: "sudo shutdown 02:00"
        user: "{{ default_user }}"
