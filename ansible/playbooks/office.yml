---
- name: Install and configure nodes
  hosts: localhost
  gather_facts: true
  become: true
  vars_files:
    - ../vars/main.yml
    - ../vars/ubuntu.yml
    - ../vars/vault.yml
  vars:
    ps1: '${debian_chroot:+($debian_chroot)}\[\033[1;32m\]\u@\h:\[\033[1;34m\]\w\[\033[00m\]\[\033[0;37m\]$(__git_ps1)\[\033[00m\] $ '
    ps1_root: '${debian_chroot:+($debian_chroot)}\[\033[1;38;5;213m\]\u@\h:\[\033[1;34m\]\w\[\033[00m\] $ '
  tasks:
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/hardening
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/bash

    - ansible.builtin.include_tasks:
        file: ../tasks/bash-secrets.yml
      vars:
        line: "{{ item }}"
      loop:
        - "export SONARCLOUD_TOKEN={{ SONARCLOUD_TOKEN }}"
        - "export GITHUB_METRICS_EXPORTER_TOKEN={{ GITHUB_METRICS_EXPORTER_TOKEN }}"

    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/filesystem
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/git
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/packages
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/packages
        tasks_from: fastfetch
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/packages
        tasks_from: desktop
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/docker
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/vscode
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/cron
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/taskfile-dev
    - ansible.builtin.include_role:
        name: ../roles/common/taskfile-dev
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/ansible
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/conky
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/github-cli
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/node
        tasks_from: main

- name: Install and configure nodes (non-root)
  hosts: localhost
  gather_facts: true
  become: false
  vars_files:
    - ../vars/main.yml
    - ../vars/ubuntu.yml
    - ../vars/vault.yml
  tasks:
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/atuin
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/cron
        tasks_from: jobs
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/docker
        tasks_from: scout
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/vscode
        tasks_from: plugins
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/node
        tasks_from: modules-ai
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/claude
