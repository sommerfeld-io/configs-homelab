---
- name: Ping all nodes on the homelab
  hosts: all
  gather_facts: true
  become: false
  tasks:

    - name: Ping nodes
      ansible.builtin.ping:

    - name: Network  ----  Check network route metrics
      block:
        - name: Network  ----  Show default routes with metrics
          ansible.builtin.shell: ip route show default
          args:
            executable: /bin/bash
          register: routes
          changed_when: false
        - name: Network  ----  Print routes
          ansible.builtin.debug:
            var: routes.stdout_lines

    - name: Network  ----  Check all interface link states
      block:
        - name: Network  ----  Show all interfaces
          ansible.builtin.shell: ip -brief link show
          args:
            executable: /bin/bash
          register: ip_links
          changed_when: false
        - name: Network  ----  Print interfaces
          ansible.builtin.debug:
            var: ip_links.stdout_lines

    - name: Network  ----  Show IP addresses on real interfaces
      block:
        - name: Network  ----  Get IP addresses for ethernet and wifi interfaces
          ansible.builtin.shell:
            cmd: ip -brief -4 addr show | grep -vE '^lo|^docker|^br-|^veth|^virbr'
          args:
            executable: /bin/bash
          register: ip_addrs
          changed_when: false
          failed_when: false
        - name: Network  ----  Print IP addresses
          ansible.builtin.debug:
            var: ip_addrs.stdout_lines

    - name: SSH  ----  Show public key
      block:
        - name: SSH  ----  Read id_rsa.pub
          ansible.builtin.shell: cat /home/sebastian/.ssh/id_rsa.pub
          args:
            executable: /bin/bash
          register: ssh_pub_key
          changed_when: false
          failed_when: false
        - name: SSH  ----  Print id_rsa.pub
          ansible.builtin.debug:
            var: ssh_pub_key.stdout_lines

    - name: Docker  ----  List running containers
      ansible.builtin.shell: |
        if command -v docker >/dev/null 2>&1; then
          {% raw %}docker ps --format '{{json .}}'{% endraw %}
        fi
      args:
        executable: /bin/bash
      register: docker_containers
      changed_when: false
      failed_when: false

    - name: Docker  ----  Prepare container metadata for docs
      ansible.builtin.set_fact:
        docker_containers_for_docs: >-
          {%- set rows = [] -%}
          {%- for line in docker_containers.stdout_lines | default([]) -%}
            {%- if line | trim | regex_search('^\\{.*\\}$') -%}
              {%- set container = line | from_json -%}
              {%- if container.Names is defined and container.Image is defined -%}
                {%- set image_ref = container.Image -%}
                {%- set image_name = image_ref -%}
                {%- set image_tag = 'n/a' -%}
                {%- if '@' in image_ref -%}
                  {%- set image_name = image_ref.split('@', 1)[0] -%}
                {%- elif ':' in (image_ref.split('/') | last) -%}
                  {%- set image_name = image_ref.rsplit(':', 1)[0] -%}
                  {%- set image_tag = image_ref.rsplit(':', 1)[1] -%}
                {%- endif -%}
                {%- set _ = rows.append({
                      'name': container.Names,
                      'image': image_name,
                      'tag': image_tag,
                      'ports': (container.Ports if (container.Ports | default('')) else 'n/a'),
                    }) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ rows if rows else [{'name': 'n/a', 'image': 'n/a', 'tag': 'n/a', 'ports': 'n/a'}] }}

    - name: Docs  ----  Generate node configs documentation
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/node-configs.md.j2"
        dest: "{{ playbook_dir }}/../../docs/nodes/node-configs.md"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true
