---
## See <https://github.com/sommerfeld-io/fantasy-hockey/blob/main/docs/index.md>
## Values for the ${...} variables below are read from the .env file that
## this role templates into the same directory as this compose file.
services:
  app:
    image: sommerfeldio/fantasy-hockey:0.1.1
    container_name: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    # Loopback-only: the app's /metrics endpoint is otherwise unauthenticated,
    # and nginx already reaches this service over the compose network.
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./data:/data
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      DATA_FILE: /data/fantasy-hockey.yml
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD}

  nginx:
    image: nginx:1.31.6
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - 80:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
