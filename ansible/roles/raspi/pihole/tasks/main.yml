---
- name: RasPi  ----  Pi-hole  ----  Free port 53 for DNS
  when: ansible_facts['os_family'] == "Debian"
  block:

    - name: RasPi  ----  Pi-hole  ----  Disable systemd-resolved DNS stub listener
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?DNSStubListener='
        line: 'DNSStubListener=no'
        state: present
      register: raspi_pihole_resolved_conf

    - name: RasPi  ----  Pi-hole  ----  Point resolv.conf at the non-stub resolver
      ansible.builtin.file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
      register: raspi_pihole_resolv_conf

    - name: RasPi  ----  Pi-hole  ----  Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when: raspi_pihole_resolved_conf.changed or raspi_pihole_resolv_conf.changed

    - name: RasPi  ----  Pi-hole  ----  Verify port 53 is free
      ansible.builtin.wait_for:
        port: 53
        state: stopped
        timeout: 10

- name: RasPi  ----  Pi-hole  ----  Deploy Pi-hole
  block:

    - name: RasPi  ----  Pi-hole  ----  Create deploy directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rwx,g=rx,o=rx
      with_items:
        - "{{ raspi_pihole_path }}"

    - name: RasPi  ----  Pi-hole  ----  Copy docker-compose.yml
      ansible.builtin.copy:
        src: files/docker-compose.yml
        dest: "{{ raspi_pihole_path }}/docker-compose.yml"
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rw,g=r,o=r
      register: raspi_pihole_compose_file

    - name: RasPi  ----  Pi-hole  ----  Start containers
      community.docker.docker_compose_v2:
        project_src: "{{ raspi_pihole_path }}"
        state: present
        pull: missing

    - name: RasPi  ----  Pi-hole  ----  Restart stack on config change
      community.docker.docker_compose_v2:
        project_src: "{{ raspi_pihole_path }}"
        state: restarted
      when: raspi_pihole_compose_file.changed

    - name: RasPi  ----  Pi-hole  ----  Verify Pi-hole is running
      community.docker.docker_container_info:
        name: pihole
      register: raspi_pihole_info

    - name: RasPi  ----  Pi-hole  ----  Assert Pi-hole is running
      ansible.builtin.assert:
        that:
          - raspi_pihole_info.container.State.Running
        fail_msg: "Pi-hole container is not running"
        success_msg: "Pi-hole container is running"
