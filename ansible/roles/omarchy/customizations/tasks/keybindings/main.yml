---
# Omarchy-only customization (Arch/Hyprland). Guarded by os_family so this never runs
# against Debian/Ubuntu hosts, matching the internal os_family guard pattern used
# elsewhere in the ansible-roles-collection (e.g. bash, docker).

- name: Omarchy Customizations  ----  Keybindings  ----  Arch
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    # SUPER+SHIFT+RETURN (and SUPER+SHIFT+B, private browsing) don't launch a fixed
    # browser binary - they all run /usr/share/omarchy/bin/omarchy-launch-browser,
    # which resolves the browser via `xdg-settings get default-web-browser`. That in
    # turn reads the [Default Applications] section of ~/.config/mimeapps.list, so
    # changing the system default browser here - not bindings.lua - is what makes
    # those keybindings open Firefox instead of Chromium. SUPER+SHIFT+RETURN is
    # additionally rebound to launch Firefox directly further below, so it no longer
    # depends on the xdg default resolving correctly.
    - name: Omarchy Customizations  ----  Keybindings  ----  Arch  ----  Set default browser
      community.general.ini_file:
        path: "/home/{{ default_user }}/.config/mimeapps.list"
        section: Default Applications
        option: "{{ item }}"
        value: "{{ omarchy_customizations_default_browser }}"
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rw,g=r,o=
        no_extra_spaces: true
      with_items:
        - text/html
        - x-scheme-handler/http
        - x-scheme-handler/https
        - x-scheme-handler/about
        - x-scheme-handler/unknown

    # Only present on actual Omarchy hosts (not vanilla Arch/test containers), so
    # check for it first instead of forcing blockinfile to create it.
    - name: Omarchy Customizations  ----  Keybindings  ----  Arch  ----  Check for Hyprland keybindings file
      ansible.builtin.stat:
        path: "/home/{{ default_user }}/.config/hypr/bindings.lua"
      register: omarchy_customizations_keybindings_bindings_file

    # Every key below ships a default binding (Google Photos, Omawrite, Signal, Music/
    # Spotify, Editor, Google Maps - see /usr/share/omarchy/default/hypr/bindings/
    # applications.lua) or a default action (SUPER+L toggles the workspace layout - see
    # tiling.lua), so each default must be unbound before the new one is added -
    # otherwise Hyprland just stacks the new bind on top of the default and both fire.
    #
    # { webapp = "..." } resolves (helpers.lua) to `omarchy-launch-webapp`, which opens
    # the URL frameless (no address bar/tabs) via the installed Chromium-family
    # browser's --app mode - independent of the Firefox default-browser change above,
    # since omarchy-launch-webapp falls back to chromium.desktop for non-Chromium
    # browsers. `focus = true` makes repeat presses refocus the already-open window
    # instead of opening a duplicate. Sublime Text instead launches directly via `subl`
    # ({ launch = "subl" }), SUPER+SHIFT+RETURN launches Firefox directly
    # ({ launch = "firefox" }) instead of going through omarchy-launch-browser, and
    # screen locking uses the omarchy-system-lock binary directly (the same command
    # SUPER+CTRL+L already runs by default), not the interactive `omarchy system lock`
    # CLI wrapper.
    - name: Omarchy Customizations  ----  Keybindings  ----  Arch  ----  Rebind SUPER+SHIFT shortcuts (Firefox, web apps, Sublime, lock)
      ansible.builtin.blockinfile:
        dest: "/home/{{ default_user }}/.config/hypr/bindings.lua"
        marker: "-- {mark} ANSIBLE MANAGED BLOCK - custom web app, sublime text, and lock screen keybindings"
        block: |
          hl.unbind("SUPER + SHIFT + A")
          hl.unbind("SUPER + SHIFT + ALT +A")
          hl.unbind("SUPER + SHIFT + B")
          hl.unbind("SUPER + SHIFT + C")
          hl.unbind("SUPER + SHIFT + G")
          hl.unbind("SUPER + SHIFT + K")
          hl.unbind("SUPER + SHIFT + M")
          hl.unbind("SUPER + SHIFT + N")
          hl.unbind("SUPER + SHIFT + P")
          hl.unbind("SUPER + SHIFT + S")
          hl.unbind("SUPER + SHIFT + V")
          hl.unbind("SUPER + SHIFT + W")
          hl.unbind("SUPER + SHIFT + X")
          hl.unbind("SUPER + SHIFT + RETURN")
          hl.unbind("SUPER + L")
          o.bind("SUPER + SHIFT + RETURN", "Firefox", { launch = "firefox" })
          o.bind("SUPER + SHIFT + B", "Bitwarden", { webapp = "https://vault.bitwarden.com", focus = true })
          o.bind("SUPER + SHIFT + P", "GitHub Project", { webapp = "https://github.com/orgs/sommerfeld-io/projects/1/views/1", focus = true })
          o.bind("SUPER + SHIFT + S", "Sublime Text", { launch = "subl" })
          o.bind("SUPER + SHIFT + W", "WhatsApp", { webapp = "https://web.whatsapp.com", focus = true })
          o.bind("SUPER + SHIFT + X", "ChatGPT", { webapp = "https://chatgpt.com", focus = true })
          o.bind("SUPER + SHIFT + C", "Claude", { webapp = "https://claude.ai/new", focus = true })
          o.bind("SUPER + SHIFT + V", "Gemini", { webapp = "https://gemini.google.com/app", focus = true })
          o.bind("SUPER + SHIFT + G", "Grafana", { webapp = "https://sommerfeldio.grafana.net/d/node-fleet/linux-node-fleet-overview", focus = true })
          o.bind("SUPER + SHIFT + M", "Google Mail", { webapp = "https://mail.google.com/mail/u/0/?hl=de&tab=wm#inbox", focus = true })
          o.bind("SUPER + SHIFT + N", "Google Calendar", { webapp = "https://calendar.google.com/calendar/u/0/r?pli=1", focus = true })
          o.bind("SUPER + L", "Lock screen", "omarchy-system-lock")
      when: omarchy_customizations_keybindings_bindings_file.stat.exists
