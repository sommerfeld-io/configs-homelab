---
# Omarchy-only customization (Arch/Hyprland). Guarded by os_family so this never runs
# against Debian/Ubuntu hosts, matching the internal os_family guard pattern used
# elsewhere in the ansible-roles-collection (e.g. bash, docker).

- name: Omarchy Customizations  ----  GitHub Theme  ----  Arch
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    - name: Omarchy Customizations  ----  GitHub Theme  ----  Arch  ----  Create theme directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rwx,g=rx,o=
      with_items:
        - "/home/{{ default_user }}/.config/omarchy/themes/{{ common_omarchy_customizations_github_theme_name }}"
        - "/home/{{ default_user }}/.config/omarchy/themes/{{ common_omarchy_customizations_github_theme_name }}/backgrounds"

    - name: Omarchy Customizations  ----  GitHub Theme  ----  Arch  ----  Copy theme files
      ansible.builtin.copy:
        src: "../../files/github-theme/{{ item }}"
        dest: "/home/{{ default_user }}/.config/omarchy/themes/{{ common_omarchy_customizations_github_theme_name }}/{{ item }}"
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rw,g=r,o=
      with_items:
        - colors.toml
        - icons.theme
        - neovim.lua
        - vscode.json
        - shell.lock.toml
        - keyboard.rgb

    - name: Omarchy Customizations  ----  GitHub Theme  ----  Arch  ----  Copy wallpapers
      ansible.builtin.copy:
        src: "../../files/github-theme/backgrounds/{{ item }}"
        dest: "/home/{{ default_user }}/.config/omarchy/themes/{{ common_omarchy_customizations_github_theme_name }}/backgrounds/{{ item }}"
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rw,g=r,o=
      with_items:
        - 0-11.jpg # sorts first, making it the default background when the theme is first applied
        - 1.jpg
        - 2.jpg
        - 3.jpg
        - 4.jpg
        - 5.jpg
        - 6.jpg
        - 7.jpg
        - 8.jpg
        - 9.jpg
        - 10.jpg
