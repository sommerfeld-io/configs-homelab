---
# SIGUSR2 makes a running Waybar reload its config in place, so this works without
# the user's Wayland session environment (unlike restarting Waybar). No-op when
# Waybar is not running.
- name: Omarchy Customizations  ----  Reload Waybar
  become: true
  become_user: "{{ default_user }}"
  ansible.builtin.command: pkill -SIGUSR2 -x waybar
  register: common_omarchy_customizations_waybar_reload
  changed_when: common_omarchy_customizations_waybar_reload.rc == 0
  failed_when: common_omarchy_customizations_waybar_reload.rc not in [0, 1]
