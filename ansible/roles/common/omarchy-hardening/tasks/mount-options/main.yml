---
# Omarchy-only hardening (Arch/Hyprland). Guarded by os_family so this never runs
# against Debian/Ubuntu hosts, matching the internal os_family guard pattern used
# elsewhere in the ansible-roles-collection (e.g. bash, docker) and in
# omarchy-customizations.
#
# Fixes dev-sec linux-baseline controls os-15 (nosuid) and os-16 (nodev): hardens
# fstab options and live-remounts mountpoints that don't need to allow device nodes
# or setuid/setgid binaries.
#
# Only ever touches a mountpoint it can positively confirm from ansible_facts.mounts,
# and reuses that mountpoint's own device/fstype - guessing either would risk
# corrupting fstab or failing to remount. This also makes the task a safe no-op
# inside the Molecule test containers, where /boot, /home and /var/log are just
# plain directories on the root filesystem rather than separate mounts.
#
# Always carries `nofail`: if the derived device/fstype ever mismatches what
# fstab needs, a failed mount at boot degrades to a missing mountpoint instead
# of blocking local-fs.target and dropping systemd into emergency mode.
- name: Omarchy Hardening  ----  Mount Options  ----  Arch
  when: ansible_facts['os_family'] == "Archlinux"
  block:

    - name: Omarchy Hardening  ----  Mount Options  ----  Arch  ----  Harden nosuid/nodev
      vars:
        common_omarchy_hardening_mount_entry: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', item) | list | first | default({}) }}"
        common_omarchy_hardening_mount_opts: "{{ (common_omarchy_hardening_mount_entry.get('options', '').split(',') + ['nosuid', 'nodev', 'nofail']) | unique | reject('equalto', '') | join(',') }}"
      ansible.posix.mount:
        path: "{{ item }}"
        src: "{{ common_omarchy_hardening_mount_entry.get('device', '') }}"
        fstype: "{{ common_omarchy_hardening_mount_entry.get('fstype', '') }}"
        opts: "{{ common_omarchy_hardening_mount_opts }}"
        state: mounted
      when: common_omarchy_hardening_mount_entry | length > 0
      loop: "{{ common_omarchy_hardening_hardened_mountpoints }}"
      loop_control:
        label: "{{ item }}"
