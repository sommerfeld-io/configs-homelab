---
# Manages secrets exported as environment variables in the default user's .bashrc.
#
# Included via `include_tasks` in a loop, one iteration per secret. `line` must be passed
# in via `vars:` on the include_tasks call, e.g.:
#
#   - ansible.builtin.include_tasks:
#       file: ../tasks/bash-secrets.yml
#     vars:
#       line: "{{ item }}"
#     loop:
#       - "export SONARCLOUD_TOKEN={{ SONARCLOUD_TOKEN }}"

# Writes the secret passed in via `line` to the default user's .bashrc (added once, left
# untouched if already present).
- name: Bash  ----  Secrets  ----  Write to .bashrc
  ansible.builtin.lineinfile:
    dest: "/home/{{ default_user }}/.bashrc"
    state: present
    line: "{{ line }}" # `line` must be passed in via `vars:` on the include_tasks call

# Removes exports of secrets that no longer exist (e.g. deleted from the vault), so stale
# tokens don't linger in any .bashrc. Matches by variable name, since the value is unknown
# once the secret is gone. A missing .bashrc is not an error.
- name: Bash  ----  Secrets  ----  Remove obsolete secrets from .bashrc
  ansible.builtin.lineinfile:
    dest: "{{ bash_secrets_obsolete[0] }}"
    state: absent
    regexp: "^export {{ bash_secrets_obsolete[1] }}="
  loop: "{{ ['/home/' ~ default_user ~ '/.bashrc', '/root/.bashrc'] | product(['GITHUB_METRICS_EXPORTER_TOKEN']) | list }}"
  loop_control:
    loop_var: bash_secrets_obsolete # the include_tasks call already uses `item`
    label: "{{ bash_secrets_obsolete[1] }} in {{ bash_secrets_obsolete[0] }}"
