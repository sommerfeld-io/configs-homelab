---
- name: Converge
  hosts: all
  vars:
    default_user: molecule
  pre_tasks:
    - name: Ensure ~/.config exists for the test user
      ansible.builtin.file:
        path: /home/{{ default_user }}/.config
        state: directory
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rwx,g=rx,o=
  roles:
    - monitor-config
    - customizations
