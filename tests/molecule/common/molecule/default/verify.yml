---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Check docker_stacks_dir exists
      ansible.builtin.stat:
        path: /home/molecule/.docker-stacks
      register: stacks_dir

    - name: Assert docker_stacks_dir exists
      ansible.builtin.assert:
        that: stacks_dir.stat.exists and stacks_dir.stat.isdir

    - name: Check taskfile.yml was copied
      ansible.builtin.stat:
        path: /home/molecule/taskfile.yml
      register: taskfile

    - name: Assert taskfile.yml exists
      ansible.builtin.assert:
        that: taskfile.stat.exists

    - name: Check .bashrc does not contain TASK_X_REMOTE_TASKFILES
      ansible.builtin.command: grep -q 'TASK_X_REMOTE_TASKFILES=' /home/molecule/.bashrc
      register: bashrc_grep
      failed_when: bashrc_grep.rc == 0
      changed_when: false
