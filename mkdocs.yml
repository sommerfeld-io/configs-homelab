          - Grafana Agents: homelab/ansible/playbooks/grafana-agents.md
          - Netaudit: homelab/ansible/playbooks/netaudit.md
          - Ollama: homelab/ansible/playbooks/ollama.md
          - Omarchy Snapshot Create: homelab/ansible/playbooks/omarchy-snapshot-create.md
          - Omarchy Snapshot List: homelab/ansible/playbooks/omarchy-snapshot-list.md
          - Ping: homelab/ansible/playbooks/ping.md
