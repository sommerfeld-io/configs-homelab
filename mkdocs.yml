---
site_name: Homelab Configs
site_url: https://www.sommerfeld.io
site_author: Sebastian Sommerfeld
site_description: >-
  Homelab Configs for sommerfeld.io projects.

repo_name: sommerfeld-io/configs-homelab
repo_url: https://github.com/sommerfeld-io/configs-homelab

copyright: >
  Copyright &copy; 2024 Sommerfeld.io |
  <a href="#__consent">Cookie settings</a>

docs_dir: docs
site_dir: target/docs/site

theme:
  name: material
  font:
    text: Work Sans
  palette:
    scheme: slate
    primary: blue grey # black
    accent: deep orange
  features:
    - content.code.copy
    - content.tabs.link
    # - navigation.tabs
    - navigation.footer
    # - navigation.expand
    # - navigation.sections
    - navigation.tracking

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - kroki:
  - search:

extra:
  consent:
    title: Cookie consent
    description: >-
      Our documentation website is hosted on GitHub Pages and uses services from GitHub,
      Google Fonts, and Kroki, each with their own terms and privacy policies. We do not
      control or influence the data these third parties may collect. The site itself does
      not set cookies, track users, or collect personal data. For detals, see our
      <a href="https://github.com/sommerfeld-io/.github/blob/main/docs/terms.md">Terms of Use</a>.
    actions:
      - accept
      - reject
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sommerfeld-io/configs-homelab

nav:
  - Introduction: index.md
  # - Ubuntu Workstations:
  #     - Setup Guide: nodes/ubuntu-workstations/index.md
  - Ubuntu Workstations: nodes/ubuntu-workstations/index.md
  - Omarchy Workstations: nodes/omarchy-workstations/index.md
  - Raspberry Pi Nodes: nodes/raspi/index.md
  - Node Configs: nodes/node-configs.md
  - Ansible - Playbooks:
      - All (provision full Homelab): ansible/playbooks/all.md
      - Cleanup: ansible/playbooks/cleanup.md
      - Desktop: ansible/playbooks/desktop.md
      - Desktop Media: ansible/playbooks/desktop-media.md
      - Grafana Agents: ansible/playbooks/grafana-agents.md
      - Ollama: ansible/playbooks/ollama.md
      - Ping: ansible/playbooks/ping.md
      - RasPi: ansible/playbooks/raspi.md
      - Repositories: ansible/playbooks/repositories.md
      - Scan: ansible/playbooks/scan.md
      - Server: ansible/playbooks/server.md
      - SSH Trust: ansible/playbooks/ssh-trust.md
  - Ansible - Roles:
      - Common / Mount HDD: ansible/roles/common/mount-disk.md
      - Common / Taskfile Dev: ansible/roles/common/taskfile-dev.md
      - Grafana Cloud / Alloy: ansible/roles/grafana-cloud/alloy.md
      - Grafana Cloud / Exporters: ansible/roles/grafana-cloud/exporters.md
      - Media / Jellyfin: ansible/roles/media/jellyfin.md
      - Omarchy / Customizations: ansible/roles/omarchy/customizations.md
      - Omarchy / Monitor Config: ansible/roles/omarchy/monitor-config.md
      - Omarchy / Snapshot: ansible/roles/omarchy/snapshot.md
      - RasPi / Pi-hole: ansible/roles/raspi/pihole.md
      - RasPi / Fritz-Box Exporter: ansible/roles/raspi/fritz-box-exporter.md
  - ansible/molecule.md
  - Incidents:
      - Runbooks:
          - incidents/runbooks/pihole.md
  - license.md
  - Releases on GitHub ⧉: https://github.com/sommerfeld-io/configs-homelab/releases
  - Architecture Decision Records on GitHub ⧉: https://github.com/sommerfeld-io/configs-homelab/issues?q=is%3Aissue+label%3AADR
  - Development Guide ⧉: https://github.com/sommerfeld-io/.github/blob/main/docs/development-guide.md
  - Other Code Guidelines ⧉: https://github.com/sommerfeld-io/.github/blob/main/.github/copilot-instructions.md
  - How to Contribute ⧉: https://github.com/sommerfeld-io/.github/blob/main/CONTRIBUTING.md
  - Code of Conduct ⧉: https://github.com/sommerfeld-io/.github/blob/main/CODE_OF_CONDUCT.md
  - Security Policy ⧉: https://github.com/sommerfeld-io/.github/blob/main/SECURITY.md
  - Terms of Use ⧉: https://github.com/sommerfeld-io/.github/blob/main/docs/terms.md
