---
version: '3.42.1'

# Included in configs-cloud/taskfile.yml with prefix `digital-ocean:opentofu` and
# `dir: digital-ocean/opentofu`, so the tasks are called as
# `task cloud:digital-ocean:opentofu:<name>`.

tasks:

  init:
    desc: Initialize the OpenTofu working directory for DigitalOcean
    cmds:
      - tofu init

  fmt:
    desc: Format the OpenTofu files for DigitalOcean
    cmds:
      - tofu fmt -recursive

  # Checks syntax and references without the token or the state. The first
  # validate is quiet; whenever it fails (e.g. the provider cache is missing or
  # does not match the lock file), the task initializes without a backend. Only
  # that init needs the network, and -lockfile=readonly never rewrites
  # .terraform.lock.hcl. A failed init does not stop the task: the final
  # validate always runs and reports the result.
  validate:
    desc: Validate the OpenTofu configuration for DigitalOcean
    cmds:
      - cmd: tofu validate >/dev/null 2>&1 || tofu init -backend=false -input=false -lockfile=readonly
        ignore_error: true
      - tofu validate

  # `tofu plan -detailed-exitcode` exits 0 when there are no changes, 2 when
  # there are (docs/cloud/digital-ocean/dns-zone.md).
  plan:
    desc: Show the changes OpenTofu would make on DigitalOcean (needs DIGITALOCEAN_ACCESS_TOKEN)
    preconditions: &do-token
      - sh: test -n "$DIGITALOCEAN_ACCESS_TOKEN"
        msg: DIGITALOCEAN_ACCESS_TOKEN is not set, see docs/cloud/digital-ocean/api-token.md
    cmds:
      - tofu plan

  apply:
    desc: Apply the OpenTofu configuration to DigitalOcean (needs DIGITALOCEAN_ACCESS_TOKEN)
    preconditions: *do-token
    cmds:
      - tofu apply

  # Applies without the "yes" prompt, so read `plan` first. prevent_destroy
  # still refuses any plan that would destroy the volume or the reserved IP.
  apply:yes:
    desc: Apply the OpenTofu configuration to DigitalOcean without asking for confirmation (needs DIGITALOCEAN_ACCESS_TOKEN)
    preconditions: *do-token
    cmds:
      - tofu apply -auto-approve
