---
# Dynamic inventory: droplets are discovered through the DigitalOcean API, so no
# host is ever listed here. The plugin names a host after its droplet and does not
# set ansible_host, so compose sets it to the droplet's own public IPv4 (not the
# reserved IP).
plugin: community.digitalocean.digitalocean
oauth_token: "{{ lookup('env', 'DIGITALOCEAN_ACCESS_TOKEN') }}"
attributes:
  - id
  - name
  - networks
  - region
  - image
  - tags
# Every droplet in the account is part of the inventory, nothing is filtered.
# Group by distribution.
groups:
  ubuntu: do_image.distribution == 'Ubuntu'
# One group per droplet tag, named exactly like the tag: the stage tag from
# OpenTofu (dev, test or prod) and extra tags such as fantasy-hockey.
keyed_groups:
  - key: do_tags
    prefix: ''
    separator: ''
    leading_separator: false
# Droplets only have root, and a new droplet's host key is unknown on the first
# connection, so accept it instead of prompting.
compose:
  ansible_host: do_networks.v4 | selectattr('type', 'eq', 'public') | map(attribute='ip_address') | first
  ansible_user: "'root'"
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=accept-new'"
  # Pin the interpreter, so Ansible does not warn about the discovered one.
  ansible_python_interpreter: "'/usr/bin/python3'"
  # The droplet name is <stage>-<key> (set by OpenTofu), so the name prefix is the
  # single source of the stage. Alloy sets both as labels on every series, and
  # deploy-fantasy-hockey.yml builds the app's domain from alloy_stage, so a
  # change here also changes the domain.
  alloy_stage: do_name.split('-')[0]
  alloy_environment: "'digital-ocean'"
