---
# A droplet that `deploy` just created may not accept SSH yet, and cloud-init may
# still be running (and holding the apt lock). Fact gathering would connect at once,
# so this play waits before the provisioning play starts.
- name: Wait for new droplets
  hosts: ubuntu
  gather_facts: false
  tasks:

    # Read hostvars: inside a task ansible_host falls back to the host name, which
    # does not resolve, so `ansible_host is defined` is always true.
    - name: Stop when the inventory found no public IPv4
      ansible.builtin.assert:
        that:
          - hostvars[inventory_hostname].ansible_host is defined
          - hostvars[inventory_hostname].ansible_host | length > 0
        fail_msg: >-
          {{ inventory_hostname }} has no public IPv4 in the DigitalOcean API, so
          the inventory could not set ansible_host. Check the droplet with
          `task cloud:info` and run provision again once it has an address.
        quiet: true

    - name: Wait until the droplet accepts SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: timeout 600 cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      # 0 = done, 2 = done with recoverable errors, 1 = critical error,
      # 124 = still running after 10 minutes.
      failed_when: cloud_init_status.rc not in [0, 2]

- name: Provision DigitalOcean droplets
  hosts: ubuntu
  gather_facts: true
  become: true
  vars_files:
    - ../vars/main.yml
    - ../../../../configs-homelab/ansible/vars/grafana-vault.yml
  tasks:

    # Sets /etc/localtime through timedatectl. The roles collection's filesystem
    # role only writes /etc/timezone, which Ubuntu does not read for the system
    # time zone.
    - name: Set the time zone to Europe/Berlin
      community.general.timezone:
        name: Europe/Berlin

    - name: Configure the root bash prompt
      ansible.builtin.include_role:
        name: ../../../../configs-homelab/ansible/roles/ansible-roles-collection/bash
        tasks_from: 11-bash-config-root

    - name: Install the basic command line tools
      ansible.builtin.include_role:
        name: ../../../../configs-homelab/ansible/roles/ansible-roles-collection/packages
        tasks_from: basics

    - name: Install Docker
      ansible.builtin.include_role:
        name: ../../../../configs-homelab/ansible/roles/ansible-roles-collection/docker
        tasks_from: main

    - name: Add a swap file
      ansible.builtin.include_role:
        name: ../roles/swap

    # The exporters role checks the published port against this same variable, so
    # a lost override (role default 0.0.0.0) would publish cAdvisor on the public IP
    # and still pass. The droplet has no firewall.
    - name: Stop when cAdvisor would not bind to localhost
      ansible.builtin.assert:
        that:
          - exporters_cadvisor_bind_address | default('') == '127.0.0.1'
        fail_msg: >-
          exporters_cadvisor_bind_address is
          '{{ exporters_cadvisor_bind_address | default('unset') }}' on
          {{ inventory_hostname }}, not 127.0.0.1, so cAdvisor would be published on
          the public IP. Set exporters_cadvisor_bind_address: 127.0.0.1 in
          configs-cloud/digital-ocean/ansible/vars/main.yml.
        quiet: true

    - name: Run cAdvisor
      ansible.builtin.include_role:
        name: ../../../../configs-homelab/ansible/roles/grafana-cloud/exporters

    - name: Install Alloy
      ansible.builtin.include_role:
        name: ../../../../configs-homelab/ansible/roles/grafana-cloud/alloy
        tasks_from: main

    # Removes the staging copy left by the deleted cloud Alloy config role.
    - name: Remove the old cloud Alloy config staging file
      ansible.builtin.file:
        path: /etc/alloy/config.cloud.alloy
        state: absent

    - name: Configure the login banner
      ansible.builtin.include_role:
        name: ../roles/motd
