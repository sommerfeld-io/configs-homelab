---
# The app data must live on the volume, and the domain must point at this
# droplet before Caddy asks Let's Encrypt for a certificate. All three checks
# run before anything is written, the user included.
- name: Fantasy Hockey  ----  Stop when the volume is not mounted
  ansible.builtin.assert:
    that:
      - ansible_facts.mounts | selectattr('mount', 'equalto', fantasy_hockey_volume_mount) | list | length > 0
    fail_msg: >-
      {{ fantasy_hockey_volume_mount }} is not a mount point on {{ inventory_hostname }}.
      The app data must live on the volume, so nothing was written. Check the
      volume with `task cloud:info` and `findmnt {{ fantasy_hockey_volume_mount }}`
      on the droplet.
    quiet: true

- name: Fantasy Hockey  ----  Stop when the deploy directory is not on the volume
  ansible.builtin.assert:
    that:
      - fantasy_hockey_path is string
      # normpath resolves '..', so a path like <mount>/../root does not pass.
      - (fantasy_hockey_path | ansible.builtin.normpath).startswith(fantasy_hockey_volume_mount ~ '/')
    fail_msg: >-
      fantasy_hockey_path ({{ fantasy_hockey_path }}) is not below
      {{ fantasy_hockey_volume_mount }}, so nothing was written. Check for an
      override of fantasy_hockey_path, for example in the vault file.
    quiet: true

- name: Fantasy Hockey  ----  Check the domain
  ansible.builtin.include_tasks: dns.yml

- name: Fantasy Hockey  ----  Create the deploy user
  ansible.builtin.include_tasks: user.yml

- name: Fantasy Hockey  ----  Write the deploy files
  ansible.builtin.include_tasks: files.yml

# The docker tasks run as default_user (a member of the docker group), so
# docker compose does not run as root.
- name: Fantasy Hockey  ----  Run the stack as the deploy user
  become: true
  become_user: "{{ default_user }}"
  block:

    - name: Fantasy Hockey  ----  Start containers
      community.docker.docker_compose_v2:
        project_src: "{{ fantasy_hockey_path }}"
        state: present
        pull: missing
        # Removes containers of services that left the compose file (the old
        # fantasy-hockey-nginx) before the new ones bind their ports.
        remove_orphans: true

    - name: Fantasy Hockey  ----  Restart stack on config change
      community.docker.docker_compose_v2:
        project_src: "{{ fantasy_hockey_path }}"
        state: restarted
      when: >-
        fantasy_hockey_compose_file.changed or
        fantasy_hockey_caddyfile.changed or
        fantasy_hockey_env_file.changed

    - name: Fantasy Hockey  ----  Read the app container
      community.docker.docker_container_info:
        name: fantasy-hockey-app
      register: fantasy_hockey_app_info

    - name: Fantasy Hockey  ----  Read the Caddy container
      community.docker.docker_container_info:
        name: fantasy-hockey-caddy
      register: fantasy_hockey_caddy_info

    - name: Fantasy Hockey  ----  Assert the app container is running
      ansible.builtin.assert:
        that:
          - fantasy_hockey_app_info.exists
          - fantasy_hockey_app_info.container.State.Running
        fail_msg: "Fantasy Hockey app container is not running"
        success_msg: "Fantasy Hockey app container is running"

    - name: Fantasy Hockey  ----  Assert the Caddy container is running
      ansible.builtin.assert:
        that:
          - fantasy_hockey_caddy_info.exists
          - fantasy_hockey_caddy_info.container.State.Running
        fail_msg: "Fantasy Hockey Caddy container is not running"
        success_msg: "Fantasy Hockey Caddy container is running"
