---
# Caddy orders the certificate for fantasy_hockey_domain as soon as it starts.
# Let's Encrypt validates against the address the name resolves to, so the
# deploy stops first when that is not this droplet's reserved IP. "Resolves at
# all" is not enough: a resolver may still cache an old answer, such as the
# sommerfeld.app wildcard's CNAME to the web host from before do.sommerfeld.app
# was delegated to DigitalOcean. fantasy_hockey_reserved_ip comes from the
# DigitalOcean metadata service (deploy-fantasy-hockey.yml).

- name: Fantasy Hockey  ----  Resolve the domain
  ansible.builtin.command: getent ahostsv4 {{ fantasy_hockey_domain }}
  register: fantasy_hockey_domain_lookup
  failed_when: false
  changed_when: false
  check_mode: false

- name: Fantasy Hockey  ----  Stop when the domain does not resolve to the reserved IP
  vars:
    fantasy_hockey_domain_addresses: >-
      {{ fantasy_hockey_domain_lookup.stdout_lines | map('split') | map('first') | unique | list }}
  ansible.builtin.assert:
    that:
      # Exactly the reserved IP: with a second A record, Let's Encrypt may
      # validate against the other address.
      - fantasy_hockey_domain_addresses == [fantasy_hockey_reserved_ip]
    fail_msg: >-
      {{ fantasy_hockey_domain }} resolves to
      {{ fantasy_hockey_domain_addresses | join(', ') if fantasy_hockey_domain_addresses else 'nothing' }},
      not to the reserved IP {{ fantasy_hockey_reserved_ip }} of {{ inventory_hostname }}.
      Caddy would request a certificate that Let's Encrypt cannot validate, so
      nothing was written. First ask the authoritative nameserver, from the
      repository root:
      `task cloud:dns:check -- +norec @ns1.digitalocean.com {{ fantasy_hockey_domain }} A`.
      If it does not answer the reserved IP (a wrong address, NXDOMAIN, or
      REFUSED when the zone is gone), the A record is declared in OpenTofu:
      run `task cloud:digital-ocean:opentofu:plan`, which compares the state
      with DigitalOcean, and apply the fix
      (docs/cloud/digital-ocean/dns-zone.md). If it answers the reserved IP,
      check the delegation:
      `task cloud:dns:check -- +norec @ns5.kasserver.com {{ fantasy_hockey_domain }} A`
      must return a referral to ns1-ns3.digitalocean.com; if not, see R1 in
      docs/cloud/digital-ocean/dns-delegation.md. If both are right, wait for
      the cache of the droplet's resolver (an NXDOMAIN up to 1800 s, an old
      address up to 300 s, the wildcard CNAME from before the delegation up
      to 7200 s) and check on the droplet with
      `getent ahostsv4 {{ fantasy_hockey_domain }}`.
    quiet: true
