---
# Third-party collections for the DigitalOcean playbooks (pinned, AD-7).
# Installed by the go-task entry points before Ansible runs.
collections:
  - name: community.digitalocean
    version: 1.27.0
  # The fleet Alloy role run from provision.yml uses
  # community.general.capabilities.
  - name: community.general
    version: 13.5.0
  # The role fantasy-hockey runs the app with docker_compose_v2 and checks the
  # containers with docker_container_info.
  - name: community.docker
    version: 5.4.0
