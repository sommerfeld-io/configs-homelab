---
version: '3.42.1'

# Included in configs-cloud/taskfile.yml with prefix `molecule` and
# `dir: digital-ocean/tests/molecule`, so the tasks are called as
# `task cloud:molecule:<name>`.

env:
  # Molecule/Ansible only colorize output when they detect a TTY. GitHub Actions runners
  # attach a pipe, not a TTY, so force colors on regardless.
  PY_COLORS: '1'

vars:
  # base.yml by absolute path, so a scenario found anywhere by the find script uses it.
  MOLECULE_CMD: uvx --with molecule-plugins[docker] --with ansible-core molecule --base-config "{{ .TASKFILE_DIR }}/base.yml"

tasks:

  test:
    desc: Run every DigitalOcean molecule scenario (folder with a tracked molecule/default/molecule.yml) end-to-end
    vars:
      # Every cloud scenario folder (repo-root-relative), the same list the CI matrix runs.
      SCENARIOS:
        sh: '"{{ .ROOT_DIR }}/.github/workflows/assets/find-molecule-cloud.sh"'
    cmds:
      - for: { var: SCENARIOS }
        task: test:{{ .ITEM }}

  test:*:
    desc: Run one role scenario end-to-end, by name (folder next to this taskfile) or by repo-root-relative path
    vars:
      # A bare name keeps `test:<name>` working; a path is what the find script lists.
      DIR: '{{ $s := index .MATCH 0 }}{{ if contains "/" $s }}{{ .ROOT_DIR }}/{{ $s }}{{ else }}{{ .TASKFILE_DIR }}/{{ $s }}{{ end }}'
    cmds:
      # cd instead of dir: Task resolves an absolute dir below the include dir (and creates it).
      - cd "{{ .DIR }}" && {{ .MOLECULE_CMD }} test
