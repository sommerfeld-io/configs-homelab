---
# Shared Molecule config for the DigitalOcean scenarios. The droplet runs Ubuntu
# only, so there is one platform: the droplet's release. The container is not
# privileged and has no host mounts, so a test can never touch the host. It has
# no systemd either; prepare.yml stubs systemctl.
driver:
  name: docker
platforms:
  - name: ubuntu-26.04
    image: ubuntu:26.04
    pre_build_image: true
    groups: [ubuntu]
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
