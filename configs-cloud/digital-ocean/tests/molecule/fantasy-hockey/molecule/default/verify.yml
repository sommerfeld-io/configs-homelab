---
- name: Verify
  hosts: all
  vars_files:
    - vars/test-vars.yml
  gather_facts: false
  vars:
    data_file: "{{ fantasy_hockey_path }}/data/fantasy-hockey.yml"
  tasks:

    - name: Read the fantasy-hockey user
      ansible.builtin.getent:
        database: passwd
        key: "{{ default_user }}"

    - name: Read the groups of the fantasy-hockey user
      ansible.builtin.command: id -nG {{ default_user }}
      register: user_groups
      changed_when: false

    - name: Assert the user has bash and is in the docker group
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd[default_user][5] == '/bin/bash'
          - "'docker' in user_groups.stdout.split()"

    # Into a namespace: loaded as plain vars, the defaults would outrank the test
    # values (fantasy_hockey_path) of vars/test-vars.yml.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: ../../../../../ansible/roles/fantasy-hockey/defaults/main.yml
        name: role_defaults

    - name: Read the .bashrc of the user
      ansible.builtin.slurp:
        src: /home/{{ default_user }}/.bashrc
      register: bashrc

    - name: Assert the prompt line in .bashrc
      ansible.builtin.assert:
        that:
          - >-
            "export PS1='" ~ role_defaults.fantasy_hockey_ps1 ~ "'" in (bashrc.content | b64decode).split('\n')
          - "'__git_ps1' not in (bashrc.content | b64decode)"

    - name: Read the deploy files
      ansible.builtin.stat:
        path: "{{ fantasy_hockey_path }}/{{ item }}"
      loop:
        - .
        - nginx
        - docker-compose.yml
        - nginx/default.conf
        - .env
        - data
        - data/fantasy-hockey.yml
      register: deploy_files

    - name: Assert owners and modes
      vars:
        files: "{{ dict(deploy_files.results | map(attribute='item') | zip(deploy_files.results | map(attribute='stat'))) }}"
      ansible.builtin.assert:
        that:
          - files['.'].pw_name == default_user and files['.'].mode == '0755'
          - files['nginx'].pw_name == default_user and files['nginx'].mode == '0755'
          - files['docker-compose.yml'].pw_name == default_user and files['docker-compose.yml'].mode == '0644'
          - files['nginx/default.conf'].pw_name == default_user and files['nginx/default.conf'].mode == '0644'
          - files['.env'].pw_name == default_user and files['.env'].gr_name == default_user
          - files['.env'].mode == '0600'
          - files['data'].uid == 1000 and files['data'].gid == 1000 and files['data'].mode == '0755'
          - files['data/fantasy-hockey.yml'].uid == 1000 and files['data/fantasy-hockey.yml'].gid == 1000
          - files['data/fantasy-hockey.yml'].mode == '0644'

    - name: Read .env
      ansible.builtin.slurp:
        src: "{{ fantasy_hockey_path }}/.env"
      register: env_file

    - name: Assert .env has the test values
      vars:
        env_lines: "{{ (env_file.content | b64decode).split('\n') }}"
      ansible.builtin.assert:
        that:
          - "'COMPOSE_PROJECT_NAME=fantasy-hockey' in env_lines"
          - "'SESSION_SECRET=molecule-session-secret' in env_lines"
          - "'SMTP_HOST=smtp.molecule.invalid' in env_lines"
          - "'SMTP_PORT=2525' in env_lines"
          - "'SMTP_USERNAME=molecule@molecule.invalid' in env_lines"
          - "'SMTP_APP_PASSWORD=molecule-smtp-password' in env_lines"

    - name: Read the seeded data file
      ansible.builtin.slurp:
        src: "{{ data_file }}"
      register: seeded

    - name: Assert the data file was seeded from the test values
      vars:
        data: "{{ seeded.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - data.season == fantasy_hockey_season
          - data.players | map(attribute='id') | list == ['alice', 'bob']
          - data.prediction_sets[0].deadline_utc == fantasy_hockey_regular_season_deadline_utc

    # The seed rule: once the data file exists, the role never touches it again.
    - name: Edit the data file like the pool operator would
      ansible.builtin.copy:
        dest: "{{ data_file }}"
        content: "# edited by hand\n"
        owner: root
        group: root
        mode: u=rw,g=,o=

    - name: Run the role's file tasks again
      ansible.builtin.include_role:
        name: ../../../../../ansible/roles/fantasy-hockey
        tasks_from: files

    - name: Read the data file after the second run
      ansible.builtin.slurp:
        src: "{{ data_file }}"
      register: after_rerun

    - name: Read the data file owner and mode after the second run
      ansible.builtin.stat:
        path: "{{ data_file }}"
      register: after_rerun_stat

    - name: Assert the data file is unchanged
      ansible.builtin.assert:
        that:
          - (after_rerun.content | b64decode) == '# edited by hand\n'
          - after_rerun_stat.stat.pw_name == 'root'
          - after_rerun_stat.stat.mode == '0600'

    # The guards of tasks/main.yml: the role stops before it writes anything (the
    # user included) when the volume is not mounted or the deploy directory is
    # not on it. Each case runs the role's main entry with its own user and path,
    # so a guard that does not stop shows up as a user or folder that exists.
    # The container cannot run Docker, so a missed guard also fails later, at
    # docker compose; the rescue therefore checks that a guard task failed.
    # /etc/hostname stands in for a mounted volume: Docker bind-mounts it into
    # every container.
    - name: Read the mount facts for the guard cases
      ansible.builtin.setup:
        gather_subset: ['!all', '!min', mounts]

    - name: Guard case, volume not mounted
      vars:
        default_user: fh-guard-unmounted
        fantasy_hockey_volume_mount: /mnt/fh-guard-unmounted
        fantasy_hockey_path: /mnt/fh-guard-unmounted/fantasy-hockey
      block:
        - name: Run the role with an unmounted volume
          ansible.builtin.include_role:
            name: ../../../../../ansible/roles/fantasy-hockey
      rescue:
        - name: Record the guard that stopped the role (volume not mounted)
          ansible.builtin.set_fact:
            guard_unmounted: "{{ ansible_failed_task.name }}"

    - name: Guard case, deploy directory outside the volume
      vars:
        default_user: fh-guard-outside
        fantasy_hockey_volume_mount: /etc/hostname
        fantasy_hockey_path: /srv/fh-guard-outside
      block:
        - name: Run the role with a deploy directory outside the volume
          ansible.builtin.include_role:
            name: ../../../../../ansible/roles/fantasy-hockey
      rescue:
        - name: Record the guard that stopped the role (outside the volume)
          ansible.builtin.set_fact:
            guard_outside: "{{ ansible_failed_task.name }}"

    - name: Guard case, deploy directory leaves the volume through ..
      vars:
        default_user: fh-guard-dotdot
        fantasy_hockey_volume_mount: /etc/hostname
        fantasy_hockey_path: /etc/hostname/../../srv/fh-guard-dotdot
      block:
        - name: Run the role with a deploy directory that leaves the volume through ..
          ansible.builtin.include_role:
            name: ../../../../../ansible/roles/fantasy-hockey
      rescue:
        - name: Record the guard that stopped the role (..)
          ansible.builtin.set_fact:
            guard_dotdot: "{{ ansible_failed_task.name }}"

    # Without the trailing '/' in the guard, /etc/hostname-sibling would pass as
    # being below /etc/hostname.
    - name: Guard case, deploy directory in a sibling of the volume
      vars:
        default_user: fh-guard-sibling
        fantasy_hockey_volume_mount: /etc/hostname
        fantasy_hockey_path: /etc/hostname-sibling/fantasy-hockey
      block:
        - name: Run the role with a deploy directory in a sibling of the volume
          ansible.builtin.include_role:
            name: ../../../../../ansible/roles/fantasy-hockey
      rescue:
        - name: Record the guard that stopped the role (sibling)
          ansible.builtin.set_fact:
            guard_sibling: "{{ ansible_failed_task.name }}"

    - name: Read the users of the guard cases
      ansible.builtin.getent:
        database: passwd
        fail_key: false

    - name: Read the folders of the guard cases
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /mnt/fh-guard-unmounted
        - /srv/fh-guard-outside
        - /srv/fh-guard-dotdot
        - /etc/hostname-sibling
      register: guard_folders

    - name: Assert each guard case was stopped by its guard before writing anything
      ansible.builtin.assert:
        that:
          - guard_unmounted is defined
          - guard_unmounted is search('Stop when the volume is not mounted')
          - guard_outside is defined
          - guard_outside is search('Stop when the deploy directory is not on the volume')
          - guard_dotdot is defined
          - guard_dotdot is search('Stop when the deploy directory is not on the volume')
          - guard_sibling is defined
          - guard_sibling is search('Stop when the deploy directory is not on the volume')
          - "'fh-guard-unmounted' not in ansible_facts.getent_passwd"
          - "'fh-guard-outside' not in ansible_facts.getent_passwd"
          - "'fh-guard-dotdot' not in ansible_facts.getent_passwd"
          - "'fh-guard-sibling' not in ansible_facts.getent_passwd"
          - guard_folders.results | selectattr('stat.exists') | list | length == 0
