---
version: '3.42.1'

# Included in the root taskfile with prefix `cloud` and `dir: configs-cloud`,
# so every task here is called as `task cloud:<name>`.

vars:
  DO_TOFU: tofu -chdir=digital-ocean/opentofu
  DO_ANSIBLE: digital-ocean/ansible

tasks:

  digital-ocean:init:
    desc: Initialize the OpenTofu working directory for DigitalOcean
    cmds:
      - "{{ .DO_TOFU }} init"

  digital-ocean:fmt:
    desc: Format the OpenTofu files for DigitalOcean
    cmds:
      - "{{ .DO_TOFU }} fmt -recursive"

  digital-ocean:plan:
    desc: Show the changes OpenTofu would make on DigitalOcean (needs DIGITALOCEAN_ACCESS_TOKEN)
    preconditions: &do-token
      - sh: test -n "$DIGITALOCEAN_ACCESS_TOKEN"
        msg: DIGITALOCEAN_ACCESS_TOKEN is not set, see docs/cloud/digital-ocean/api-token.md
    cmds:
      - "{{ .DO_TOFU }} plan"

  digital-ocean:apply:
    desc: Apply the OpenTofu configuration to DigitalOcean (needs DIGITALOCEAN_ACCESS_TOKEN)
    preconditions: *do-token
    cmds:
      - "{{ .DO_TOFU }} apply"

  digital-ocean:inventory:
    desc: List the droplets found by the dynamic inventory with their groups (needs DIGITALOCEAN_ACCESS_TOKEN)
    preconditions: *do-token
    cmds:
      - ansible-galaxy collection install -r {{ .DO_ANSIBLE }}/requirements.yml
      - ansible-inventory -i {{ .DO_ANSIBLE }}/inventory --graph

  digital-ocean:provision:
    desc: Provision all Ubuntu droplets with Ansible (needs DIGITALOCEAN_ACCESS_TOKEN)
    preconditions: *do-token
    cmds:
      - ansible-galaxy collection install -r {{ .DO_ANSIBLE }}/requirements.yml
      - ansible-playbook -i {{ .DO_ANSIBLE }}/inventory {{ .DO_ANSIBLE }}/playbooks/provision.yml

  info:
    desc: Print the DigitalOcean account and all droplets with doctl (needs DIGITALOCEAN_ACCESS_TOKEN)
    preconditions: *do-token
    cmds:
      - doctl account get
      - doctl compute droplet list
