---
- name: Install and configure nodes
  hosts: localhost
  gather_facts: true
  become: true
  vars_files:
    - ../../ansible/vars/main.yml
    - ../../ansible/vars/amd64.yml
    - ../../ansible/vars/vault.yml
    - vars/vm.yml
  tasks:
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/hardening
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/bash

    - ansible.builtin.include_tasks:
        file: ../../ansible/tasks/bash-secrets.yml
      vars:
        line: "{{ item }}"
      loop:
        - "export SONARCLOUD_TOKEN={{ SONARCLOUD_TOKEN }}"

    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/filesystem
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/git
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/packages
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/packages
        tasks_from: fastfetch
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/packages
        tasks_from: desktop
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/docker
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/vscode
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/cron
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/taskfile-dev
    - ansible.builtin.include_role:
        name: ../../ansible/roles/common/taskfile-dev
    - ansible.builtin.include_role:
        name: ../../ansible/roles/omarchy/monitor-config
    - ansible.builtin.include_role:
        name: ../../ansible/roles/omarchy/customizations
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/ansible
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/conky
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/github-cli
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/virtualization
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/node
        tasks_from: main

- name: Install and configure nodes (non-root)
  hosts: localhost
  gather_facts: true
  become: false
  vars_files:
    - ../../ansible/vars/main.yml
    - ../../ansible/vars/amd64.yml
    - ../../ansible/vars/vault.yml
    - vars/vm.yml
  tasks:
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/atuin
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/cron
        tasks_from: jobs
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/docker
        tasks_from: scout
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/vscode
        tasks_from: plugins
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/node
        tasks_from: modules-ai
    - ansible.builtin.include_role:
        name: ../../ansible/roles/ansible-roles-collection/claude
