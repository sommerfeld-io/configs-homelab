---
ps1: >-
  \[\033[1;38;5;33m\]\u@\h:\[\033[1;34m\]\w\[\033[00m\]\[\033[0;37m\]$(_b=$(git
  branch --show-current 2>/dev/null); [[ -n "$_b" ]] && printf " (%s)" "$_b")\[\033[00m\] $
ps1_root: >-
  \[\033[1;31m\]\u\[\033[00m\]@\h:\[\033[1;34m\]\w\[\033[00m\]\[\033[0;37m\]$(_b=$(git
  branch --show-current 2>/dev/null); [[ -n "$_b" ]] && printf " (%s)" "$_b")\[\033[00m\] $
ansible_ssh_common_args: '-o "SetEnv TERM=dumb"' # Avoid: "[WARNING]: Module invocation had junk after the JSON data"
