---
name: "Pipeline: Commit + Test"

on:
  push:
    branches-ignore:
      - dependabot/**
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'docs/**'
      - '.devcontainer/**'
      - '.github/workflows/dev-environment.yml'
      - '.vscode/**'
      - '.gitkeep'
      - 'grafana-cloud/manifests/git-sync/**'
  schedule:
    - cron: '0 1 * * 2'

env:
  REGISTRY: docker.io

jobs:

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_paths: node_modules target

  lint:
    runs-on: ubuntu-latest
    name: ${{ matrix.linter }}
    permissions:
      contents: read
    strategy:
      matrix:
        linter: ['yaml', 'workflows', 'filenames', 'folders', 'markdown-links', 'ansible', 'opentofu', 'alloy-config']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Login to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run lint-${{ matrix.linter }} from docker-compose.yml
        env:
          LINTER: ${{ matrix.linter }}
        run: docker compose up "lint-$LINTER" --exit-code-from "lint-$LINTER"
        shell: bash

  # Every folder with a tracked versions.tf, the same list task lint validates.
  find-opentofu-roots:
    runs-on: ubuntu-latest
    needs: [
      'shellcheck',
      'lint'
    ]
    permissions:
      contents: read
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Find OpenTofu root modules
        id: roots
        # Assigned first, so a failing script fails this step with its own message.
        run: |
          roots="$(.github/workflows/assets/find-opentofu-roots.sh | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')"
          echo "roots=$roots" >> "$GITHUB_OUTPUT"
        shell: bash

  # Every folder with a tracked inspec.yml, the same list task homelab:inspec:check checks.
  find-inspec-modules:
    runs-on: ubuntu-latest
    needs: [
      'shellcheck',
      'lint'
    ]
    permissions:
      contents: read
    outputs:
      profiles: ${{ steps.profiles.outputs.profiles }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Find InSpec profiles
        id: profiles
        # Assigned first, so a failing script fails this step with its own message.
        run: |
          profiles="$(.github/workflows/assets/find-inspec-modules.sh | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')"
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"
        shell: bash

  validate-opentofu:
    runs-on: ubuntu-latest
    name: ${{ matrix.root_module }}
    needs: [
      'find-opentofu-roots'
    ]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        root_module: ${{ fromJSON(needs.find-opentofu-roots.outputs.roots) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # Runs the OpenTofu version the root pins in required_version, so the image never drifts
      # from the pin. The image comes from ghcr.io, so the job needs no Docker Hub login; add the
      # login back if a Docker Hub image is ever pulled here (anonymous pull limits). init -backend=false needs no token and no state; the providers come from
      # the committed lock file.
      - name: Run tofu init and validate
        env:
          ROOT: ${{ matrix.root_module }}
        run: |
          version="$(sed -n 's/^ *required_version *= *"\([^"]*\)".*/\1/p' "$ROOT/versions.tf")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=$ROOT/versions.tf::required_version must be an exact x.y.z version (the image tag), found '$version'"
            exit 1
          fi
          tofu=(docker run --rm --volume "$PWD:/workspace" --workdir "/workspace/$ROOT" "ghcr.io/opentofu/opentofu:$version")
          "${tofu[@]}" init -backend=false -input=false -lockfile=readonly
          "${tofu[@]}" validate
        shell: bash

  check-inspec-profile:
    runs-on: ubuntu-latest
    name: ${{ matrix.profile }}
    needs: [
      'find-inspec-modules',
    ]
    permissions:
      contents: read
    env:
      INSPEC_IMAGE: chef/inspec:5.22.76
    strategy:
      matrix:
        # Repo-root-relative profile paths; task homelab:inspec:check:* takes a path as well as a name.
        profile: ${{ fromJSON(needs.find-inspec-modules.outputs.profiles) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate Inspec profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE: ${{ matrix.profile }}
        run: task "homelab:inspec:check:$PROFILE"
        shell: bash

  # ----- Molecule stage --------------------------------------------------------------------------

  molecule:
    name: molecule (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [
      'shellcheck',
      'lint'
    ]
    # needs: [
    #   'validate-opentofu',
    #   'check-inspec-profile',
    # ]
    if: ${{ github.actor != 'dependabot[bot]' }}
    strategy:
      # Run every scenario to the end, so one failing role group doesn't hide failures in another.
      fail-fast: false
      matrix:
        # One entry per test:<scenario> task in configs-homelab/tests/molecule/taskfile.yml - keep in sync.
        scenario: ['common', 'omarchy', 'netaudit']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run Molecule tests (${{ matrix.scenario }})
        run: task homelab:molecule:test:${{ matrix.scenario }}
        shell: bash
        env:
          # Molecule wraps each step (converge, verify, ...) in a collapsed ::group:: when it
          # detects GitHub Actions via CI, which hides the Ansible output - including which
          # task failed and why. An empty CI disables the grouping so the output shows inline.
          CI: ''
          # Same as `molecule -v`: passes ANSIBLE_VERBOSITY=1, so task results are printed
          # in detail instead of just ok/changed/failed.
          MOLECULE_VERBOSITY: '1'

  molecule-cloud:
    name: molecule-cloud (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [
      'shellcheck',
      'lint'
    ]
    # needs: [
    #   'validate-opentofu',
    #   'check-inspec-profile',
    # ]
    if: ${{ github.actor != 'dependabot[bot]' }}
    strategy:
      # Run every scenario to the end, so one failing role doesn't hide failures in another.
      fail-fast: false
      matrix:
        # One entry per test:<scenario> task in configs-cloud/digital-ocean/tests/molecule/taskfile.yml - keep in sync.
        scenario: ['motd', 'alloy', 'fantasy-hockey']
    steps:
      # Submodules are needed: the root taskfile includes taskfiles from the .task submodule.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run Molecule tests (${{ matrix.scenario }})
        run: task cloud:molecule:test:${{ matrix.scenario }}
        shell: bash
        env:
          # Molecule wraps each step (converge, verify, ...) in a collapsed ::group:: when it
          # detects GitHub Actions via CI, which hides the Ansible output - including which
          # task failed and why. An empty CI disables the grouping so the output shows inline.
          CI: ''
          # Same as `molecule -v`: passes ANSIBLE_VERBOSITY=1, so task results are printed
          # in detail instead of just ok/changed/failed.
          MOLECULE_VERBOSITY: '1'

  # ----- Build Docs stage ------------------------------------------------------------------------

  generate-docs:
    runs-on: ubuntu-latest
    needs: [
      'molecule',
      'molecule-cloud',
      'check-inspec-profile',
      'validate-opentofu',

    ]
    # needs: [
    #   'molecule',
    #   'molecule-cloud',
    # ]
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{github.ref}}
      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run task to generate docs
        run: task docs:generate
        shell: bash
      - name: Build docs-build image
        run: docker compose build docs-build
        shell: bash
      - name: Commit and push
        uses: EndBug/add-and-commit@v11.1.1
        with:
          author_name: sebastian
          author_email: sebastian@sommerfeld.io
          message: 'docs: [Actions Bot] generate docs'

  # ----- Release stage ---------------------------------------------------------------------------

  release-code:
    uses: sommerfeld-io/.github/.github/workflows/lib-release-code.yml@main
    needs: [
      'generate-docs',
    ]
    if: ${{ (github.actor != 'dependabot[bot]') && (github.ref == 'refs/heads/main') }}
    secrets:
      GH_TOKEN_REPO_AND_PROJECT: ${{ secrets.GH_TOKEN_REPO_AND_PROJECT }}
    permissions:
      contents: write
