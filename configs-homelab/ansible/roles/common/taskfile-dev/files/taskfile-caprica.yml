---
version: '3.42.1'

tasks:

  dockerhub:login:
    desc: Log in to Docker Hub and the Docker Hardened Images registry (dhi.io)
    interactive: true
    cmds:
      - docker login
      - docker login dhi.io

  # ===============================================================================================

  docker:stack:portainer:
    vars:
      STACK: portainer
    desc: Run stack {{ .STACK }} in foreground
    dir: &docker-stack-dir ~/.docker-stacks/{{ .STACK }}
    cmds:
      - docker compose up

  # ===============================================================================================

  user:cylon:
    desc: 'Switch to the cylon AI user (login shell)'
    interactive: true
    vars:
      USER: cylon
    cmds:
      - sudo -iu {{ .USER }}

  user:sebastian:
    desc: 'Switch to sebastian (login shell, asks for the password of sebastian)'
    interactive: true
    vars:
      USER: sebastian
    cmds:
      - su - {{ .USER }}

  # ===============================================================================================

  system:info:
    desc: 'Show system information'
    cmds:
      - hostnamectl
      - 'echo -e " ${B}Ubuntu Codename:${D} $(lsb_release -c | cut -f2)"'
