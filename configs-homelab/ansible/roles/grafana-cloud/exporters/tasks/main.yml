---
- name: Grafana Cloud  ----  Exporters  ----  Deploy cAdvisor
  block:

    - name: Grafana Cloud  ----  Exporters  ----  Create deploy directory
      ansible.builtin.file:
        path: "{{ exporters_path }}"
        state: directory
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rwx,g=rx,o=rx

    - name: Grafana Cloud  ----  Exporters  ----  Copy docker-compose.yml
      ansible.builtin.copy:
        src: files/docker-compose.yml
        dest: "{{ exporters_path }}/docker-compose.yml"
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rw,g=r,o=r
      register: exporters_compose_file

    - name: Grafana Cloud  ----  Exporters  ----  Write .env with the cAdvisor bind address
      ansible.builtin.copy:
        content: |
          CADVISOR_BIND_ADDRESS={{ exporters_cadvisor_bind_address }}
        dest: "{{ exporters_path }}/.env"
        owner: "{{ default_user }}"
        group: "{{ default_user }}"
        mode: u=rw,g=r,o=r

    - name: Grafana Cloud  ----  Exporters  ----  Start containers
      community.docker.docker_compose_v2:
        project_src: "{{ exporters_path }}"
        state: present
        pull: missing

    - name: Grafana Cloud  ----  Exporters  ----  Restart stack on config change
      community.docker.docker_compose_v2:
        project_src: "{{ exporters_path }}"
        state: restarted
      when: exporters_compose_file.changed

    - name: Grafana Cloud  ----  Exporters  ----  Verify cAdvisor is running
      community.docker.docker_container_info:
        name: cadvisor
      register: exporters_cadvisor_info

    - name: Grafana Cloud  ----  Exporters  ----  Assert cAdvisor is running
      ansible.builtin.assert:
        that:
          - exporters_cadvisor_info.container.State.Running
        fail_msg: "cAdvisor container is not running"
        success_msg: "cAdvisor container is running"

    - name: Grafana Cloud  ----  Exporters  ----  Assert cAdvisor port 9110 is bound to exporters_cadvisor_bind_address
      ansible.builtin.assert:
        that:
          - exporters_cadvisor_info.container.HostConfig.PortBindings['8080/tcp'][0].HostIp == exporters_cadvisor_bind_address
        fail_msg: >-
          cAdvisor port 9110 is bound to
          '{{ exporters_cadvisor_info.container.HostConfig.PortBindings['8080/tcp'][0].HostIp }}',
          but exporters_cadvisor_bind_address is '{{ exporters_cadvisor_bind_address }}'
        success_msg: "cAdvisor port 9110 is bound to {{ exporters_cadvisor_bind_address }}"
