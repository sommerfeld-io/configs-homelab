---
## See <https://github.com/pi-hole/docker-pi-hole/blob/master/README.md>
services:
  pihole:
    image: pihole/pihole:2026.10.0
    container_name: pihole
    restart: unless-stopped
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 80:80/tcp
    environment:
      TZ: Europe/Berlin
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_webserver_api_password: 'pihole'
      # All clients reach Pi-hole through the FRITZ!Box (192.168.178.1), so a
      # per-client rate limit would lock out the whole network. 0 disables it.
      FTLCONF_dns_rateLimit_count: 0
    volumes:
      - ./etc-pihole:/etc/pihole
