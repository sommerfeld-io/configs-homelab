---
- name: LAN Scan  ----  Broadcast discovery (DHCP servers, mDNS services, UPnP devices)
  tags: [lan-scan-broadcast]
  vars:
    broadcast_discovery_dhcp_columns:
      - { name: SERVER, width: 16 }
      - { name: OFFERED IP, width: 16 }
      - { name: ROUTER, width: 16 }
      - { name: DNS, width: 34 }
      - { name: DOMAIN, width: 0 }
    broadcast_discovery_discovery_columns:
      - { name: IP, width: 16 }
      - { name: HOSTNAME, width: 28 }
      - { name: PROTOCOL, width: 9 }
      - { name: SERVICE / DEVICE, width: 24 }
      - { name: DETAILS, width: 0 }
  block:
    - name: LAN Scan  ----  Send DHCP, mDNS and UPnP broadcasts on {{ ansible_facts.default_ipv4.interface }}
      ansible.builtin.command:
        cmd: >-
          nmap -e {{ ansible_facts.default_ipv4.interface }}
          --script broadcast-dhcp-discover,broadcast-dns-service-discovery,broadcast-upnp-info
      register: broadcast_discovery_scan
      changed_when: false
    - name: LAN Scan  ----  Extract DHCP servers
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          awk -v OFS='\t' '
            function flush() {
              if (server == "") return
              print server, offered, router, dns, domain
              if (!(server in seen)) { seen[server] = 1; servers++ }
              server = ""
            }
            /^\|_? ?[a-z-]+: *$/ { section = $0; sub(/^\|_? ?/, "", section); sub(/: *$/, "", section) }
            section != "broadcast-dhcp-discover" { next }
            /Response [0-9]+ of [0-9]+:/ { flush(); offered = "-"; router = "-"; dns = "-"; domain = "-" }
            {
              line = $0; sub(/^\|_? */, "", line)
              key = line; sub(/: .*$/, "", key)
              value = line; sub(/^[^:]*: /, "", value)
            }
            key == "Server Identifier"  { server = value }
            key == "IP Offered"         { offered = value }
            key == "Router"             { router = value }
            key == "Domain Name Server" { dns = value }
            key == "Domain Name"        { domain = value }
            END {
              flush()
              if (servers > 1) print "WARNING: " servers " DHCP servers answered, only one should hand out addresses"
              if (servers == 0) print "No DHCP server answered"
            }
          '
        stdin: "{{ broadcast_discovery_scan.stdout }}"
        executable: /bin/bash
      register: broadcast_discovery_dhcp_table
      changed_when: false
    - name: LAN Scan  ----  Print DHCP servers
      ansible.builtin.debug:
        msg: >-
          {{ lookup('ansible.builtin.template', role_path ~ '/../report/templates/table.txt.j2',
             template_vars={'table_columns': broadcast_discovery_dhcp_columns, 'table_lines': broadcast_discovery_dhcp_table.stdout_lines})
             | from_json }}
    - name: LAN Scan  ----  Extract mDNS services and UPnP devices
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          # The device table maps IPs to hostnames, the broadcast output is read from stdin
          awk -v OFS='\t' '
            FNR == NR { if ($1 ~ /^[0-9.]+$/) hostname[$1] = $3; next }
            function row(proto, what, details) {
              if (ip == "") return
              print ip, substr((ip in hostname) ? hostname[ip] : "-", 1, 28), proto, substr(what, 1, 24), details
            }
            function flush() {
              if (section == "broadcast-dns-service-discovery" && service != "") row("mDNS", service, details)
              if (section == "broadcast-upnp-info" && ip != "") row("UPnP", (name != "" ? name : server), details)
              service = ""; name = ""; server = ""; details = ""
            }
            function add(text) { details = details (details == "" ? "" : ", ") text }
            /^\|_? ?[a-z-]+: *$/ { flush(); ip = ""; section = $0; sub(/^\|_? ?/, "", section); sub(/: *$/, "", section); next }
            section !~ /^broadcast-(dns-service-discovery|upnp-info)$/ { next }
            {
              line = $0; sub(/^\|_? */, "", line)
              key = line; sub(/: .*$/, "", key)
              value = line; sub(/^[^:]*: /, "", value)
            }
            line ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/ { flush(); ip = line; next }
            section == "broadcast-dns-service-discovery" && line ~ /^[0-9]+\/(tcp|udp) / { flush(); service = line; next }
            section == "broadcast-dns-service-discovery" && line ~ /^(model|md|fn|ty)=/ { add(line) }
            section == "broadcast-upnp-info" && key == "Server"       { server = value }
            section == "broadcast-upnp-info" && key == "Name"         { name = value }
            section == "broadcast-upnp-info" && key ~ /^(Manufacturer|Model Name|Model Version)$/ { add(value) }
            END { flush() }
          ' <(printf "%s\n" "$LAN_SCAN_DEVICES") - | sort -u | sort -V
        stdin: "{{ broadcast_discovery_scan.stdout }}"
        executable: /bin/bash
      environment:
        LAN_SCAN_DEVICES: "{{ device_discovery_devices.stdout | default('') }}"
      register: broadcast_discovery_discovery_table
      changed_when: false
    - name: LAN Scan  ----  Print mDNS services and UPnP devices
      ansible.builtin.debug:
        msg: >-
          {{ lookup('ansible.builtin.template', role_path ~ '/../report/templates/table.txt.j2',
             template_vars={'table_columns': broadcast_discovery_discovery_columns, 'table_lines': broadcast_discovery_discovery_table.stdout_lines})
             | from_json }}

    - name: LAN Scan  ----  Broadcast discovery  ----  Write dhcp-servers.md
      when: broadcast_discovery_report | bool
      ansible.builtin.include_tasks: "{{ role_path }}/../report/tasks/write.yml"
      vars:
        report_dir: "{{ broadcast_discovery_report_dir }}"
        report_role: broadcast_discovery
        report_file: dhcp-servers.md
        report_title: DHCP Servers
        report_description: >-
          DHCP servers that answered a DHCP discover broadcast. Only one should hand out addresses.
        report_scope: "interface `{{ ansible_facts.default_ipv4.interface }}`"
        table_columns: "{{ broadcast_discovery_dhcp_columns }}"
        table_lines: "{{ broadcast_discovery_dhcp_table.stdout_lines }}"

    - name: LAN Scan  ----  Broadcast discovery  ----  Write mdns-upnp-devices.md
      when: broadcast_discovery_report | bool
      ansible.builtin.include_tasks: "{{ role_path }}/../report/tasks/write.yml"
      vars:
        report_dir: "{{ broadcast_discovery_report_dir }}"
        report_role: broadcast_discovery
        report_file: mdns-upnp-devices.md
        report_title: mDNS Services and UPnP Devices
        report_description: >-
          Services announced via mDNS and UPnP devices with manufacturer and model.
        report_scope: "interface `{{ ansible_facts.default_ipv4.interface }}`"
        table_columns: "{{ broadcast_discovery_discovery_columns }}"
        table_lines: "{{ broadcast_discovery_discovery_table.stdout_lines }}"

  rescue:
    - name: LAN Scan  ----  Broadcast discovery  ----  Remember the error
      ansible.builtin.set_fact:
        broadcast_discovery_error: "{{ ansible_failed_result.msg | default('unknown error') }} {{ ansible_failed_result.stderr | default('') }}"

    - name: LAN Scan  ----  Broadcast discovery  ----  Write dhcp-servers.md (failed)
      when: broadcast_discovery_report | bool
      ansible.builtin.include_tasks: "{{ role_path }}/../report/tasks/write.yml"
      vars:
        report_dir: "{{ broadcast_discovery_report_dir }}"
        report_role: broadcast_discovery
        report_file: dhcp-servers.md
        report_title: DHCP Servers
        report_description: >-
          DHCP servers that answered a DHCP discover broadcast. Only one should hand out addresses.
        report_scope: "interface `{{ ansible_facts.default_ipv4.interface }}`"
        report_status: "failed: {{ broadcast_discovery_error | trim }}"
        table_columns: "{{ broadcast_discovery_dhcp_columns }}"
        table_lines: []

    - name: LAN Scan  ----  Broadcast discovery  ----  Write mdns-upnp-devices.md (failed)
      when: broadcast_discovery_report | bool
      ansible.builtin.include_tasks: "{{ role_path }}/../report/tasks/write.yml"
      vars:
        report_dir: "{{ broadcast_discovery_report_dir }}"
        report_role: broadcast_discovery
        report_file: mdns-upnp-devices.md
        report_title: mDNS Services and UPnP Devices
        report_description: >-
          Services announced via mDNS and UPnP devices with manufacturer and model.
        report_scope: "interface `{{ ansible_facts.default_ipv4.interface }}`"
        report_status: "failed: {{ broadcast_discovery_error | trim }}"
        table_columns: "{{ broadcast_discovery_discovery_columns }}"
        table_lines: []

    - name: LAN Scan  ----  Broadcast discovery  ----  Fail
      ansible.builtin.fail:
        msg: "Broadcast discovery failed: {{ broadcast_discovery_error | trim }}"
