---
# TLS ports found by the service scan (netaudit/service_detection)
tls_certificates_ports: >-
  {{ service_detection_scan.stdout | default('') | regex_findall('(?m)^(\d+)/tcp\s+open\s+(?:ssl/\S+|https\S*)') | unique | join(',') }}
# Markdown reports, controlled by the play-level netaudit_reports and netaudit_reports_dir
tls_certificates_report: "{{ netaudit_reports | default(false) }}"
tls_certificates_report_dir: "{{ netaudit_reports_dir | default(role_path ~ '/../../../../../target/netaudit') | realpath }}/tls_certificates"
