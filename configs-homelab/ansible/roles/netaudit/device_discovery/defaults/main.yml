# MAC prefixes (OUIs) of Raspberry Pi Foundation / Raspberry Pi Ltd
device_discovery_raspi_ouis: "raspberry|b8:27:eb|dc:a6:32|e4:5f:01|d8:3a:dd|28:cd:c1|2c:cf:67|88:a2:9e"
# Markdown reports, controlled by the play-level netaudit_reports and netaudit_reports_dir
device_discovery_report: "{{ netaudit_reports | default(false) }}"
device_discovery_report_dir: "{{ netaudit_reports_dir | default(role_path ~ '/../../../../../target/netaudit') | realpath }}/device_discovery"
