---
- name: Install and configure nodes
  hosts: ubuntu_server
  gather_facts: true
  become: true
  vars_files:
    - ../vars/main.yml
    - ../vars/amd64.yml
    - ../vars/vault.yml
  tasks:
    - ansible.builtin.include_tasks:
        file: ../tasks/uninstall-clamav.yml
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/hardening
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/bash
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/filesystem
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/git
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/packages
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/packages
        tasks_from: fastfetch
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/docker
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/cron
        tasks_from: main
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/taskfile-dev
    - ansible.builtin.include_role:
        name: ../roles/common/taskfile-dev
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/ansible
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/github-cli
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/virtualization
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/node
        tasks_from: main

- name: Install and configure nodes (non-root)
  hosts: ubuntu_server
  gather_facts: true
  become: false
  vars_files:
    - ../vars/main.yml
    - ../vars/amd64.yml
    - ../vars/vault.yml
  tasks:
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/atuin
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/cron
        tasks_from: jobs
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/docker
        tasks_from: scout
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/node
        tasks_from: modules-ai
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/claude

- name: Install and configure the AI user
  hosts: ubuntu_server
  gather_facts: true
  become: true
  vars_files:
    - ../vars/main.yml
    - ../vars/amd64.yml
  vars:
    # Every role below targets default_user, so overriding it here provisions cylon exactly
    # like the actual {{ default_user }}. cylon is never added to ../vars/ssh-trust.yml, so
    # its key is not authorized on any other node or droplet.
    default_user: cylon
  tasks:
    - name: AI User  ----  Create user and add to docker group
      ansible.builtin.user:
        name: "{{ default_user }}"
        shell: /bin/bash
        create_home: true # Copies the /etc/skel .bashrc, the roles below append to it
        groups: docker
        append: true
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/bash
    # Same .gitconfig (and identity) as the actual default_user. only works with git
    # locally: its SSH key is not registered anywhere, so it cannot push or pull.
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/git
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/node
        tasks_from: main
    # Deploys taskfile-caprica.yml, so `task user:sebastian` works from the cylon shell
    - ansible.builtin.include_role:
        name: ../roles/common/taskfile-dev
    # Becoming an unprivileged user other than the connection user needs setfacl to hand
    # Ansible's temp files over. Without it Ansible falls back to macOS-only `chmod +a`.
    - name: AI User  ----  Install acl (needed for become_user to an unprivileged user)
      ansible.builtin.apt:
        name: acl
        state: present
    # atuin, Claude Code and the Copilot CLI install into the user's home (~/.atuin,
    # ~/.local), so they run as this user instead of root - same as for the actual
    # default_user in the non-root play above.
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/atuin
        apply:
          become_user: "{{ default_user }}"
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/node
        tasks_from: modules-ai
        apply:
          become_user: "{{ default_user }}"
    - ansible.builtin.include_role:
        name: ../roles/ansible-roles-collection/claude
        apply:
          become_user: "{{ default_user }}"

- name: Install and configure caprica specifics
  hosts: caprica.fritz.box
  gather_facts: true
  become: true
  vars_files:
    - ../vars/main.yml
    - ../vars/amd64.yml
  tasks:
    # Relies on {{ default_user }} having passwordless sudo (NOPASSWD: ALL), see
    # https://github.com/sommerfeld-io/configs-homelab/issues/160
    - name: Caprica  ----  Cron  ----  Add nightly shutdown
      ansible.builtin.cron:
        name: "nightly shutdown"
        minute: "0"
        hour: "1"
        job: "sudo shutdown 02:00"
        user: "{{ default_user }}"

- name: Include Ansible Playbook to install caprica.fritz.box as media server
  ansible.builtin.import_playbook: ./desktop-media.yml
