---
version: '3.42.1'

vars:
  # Repo-root-relative — matches the inspec container's fixed working_dir, used in docker compose args below.
  INSPEC_DIR: configs-homelab/tests/inspec

tasks:

  cleanup:
    desc: Cleanup inspec profiles and lock files
    vars:
      # Every folder with a tracked inspec.yml (repo-root-relative), the same list the
      # check-inspec-profile CI job checks.
      PROFILES: &inspec-profiles
        sh: '"{{ .ROOT_DIR }}/.github/workflows/assets/find-inspec-modules.sh"'
    cmds:
      - for: { var: PROFILES }
        cmd: |
          sudo rm -rf "{{ .ROOT_DIR }}/{{ .ITEM }}/vendor"
          sudo rm -rf "{{ .ROOT_DIR }}/{{ .ITEM }}/inspec.lock"

  check:
    desc: Vendor and check every InSpec profile (folder with a tracked inspec.yml)
    vars:
      PROFILES: *inspec-profiles
    cmds:
      - for: { var: PROFILES }
        task: check:{{ .ITEM }}

  check:*:
    desc: Vendor and check one InSpec profile, by name (in {{ .INSPEC_DIR }}) or by repo-root-relative path
    vars:
      # A bare name keeps `task homelab:inspec:check:ollama` working; a path is what the script lists.
      PROFILE_DIR: '{{ $p := index .MATCH 0 }}{{ if contains "/" $p }}{{ $p }}{{ else }}{{ .INSPEC_DIR }}/{{ $p }}{{ end }}'
    cmds:
      - task: cleanup
      - docker compose run --rm inspec vendor "{{ .PROFILE_DIR }}" --overwrite --chef-license=accept
      - docker compose run --rm inspec check "{{ .PROFILE_DIR }}" --chef-license=accept

  internal:run-profile:
    desc: Run the profile
    internal: true
    vars:
      USER: sebastian
    cmds:
      - task: cleanup
      - >-
        docker compose run --rm --env SSH_AUTH_SOCK=/ssh-auth.sock
        -v "$SSH_AUTH_SOCK:/ssh-auth.sock" inspec exec "{{ .INSPEC_DIR }}/{{ .PROFILE }}"
        --target "ssh://{{ .USER }}@{{ .HOST }}" --no-distinct-exit --chef-license=accept # --no-color

  run:caprica:
    desc: &inspec-run-desc HOST ONLY | Run InSpec against {{ .HOST }}
    vars:
      HOST: caprica.fritz.box
    cmds:
      - for: ['server-baseline', 'ollama']
        task: internal:run-profile
        vars:
          HOST: '{{ .HOST }}'
          PROFILE: '{{ .ITEM }}'

  run:kobol:
    desc: *inspec-run-desc
    vars:
      HOST: kobol.fritz.box
    cmds:
      - for: ['desktop-baseline']
        task: internal:run-profile
        vars:
          HOST: '{{ .HOST }}'
          PROFILE: '{{ .ITEM }}'

  run:picon:
    desc: *inspec-run-desc
    vars:
      HOST: picon.fritz.box
    cmds:
      - for: ['desktop-baseline', 'ollama']
        task: internal:run-profile
        vars:
          HOST: '{{ .HOST }}'
          PROFILE: '{{ .ITEM }}'

  run:pi4-0006:
    desc: *inspec-run-desc
    vars:
      HOST: pi4-0006.fritz.box
    cmds:
      - for: ['raspi-baseline']
        task: internal:run-profile
        vars:
          HOST: '{{ .HOST }}'
          PROFILE: '{{ .ITEM }}'

  run:pi4-0005:
    desc: *inspec-run-desc
    vars:
      HOST: pi4-0005.fritz.box
    cmds:
      - for: ['raspi-baseline']
        task: internal:run-profile
        vars:
          HOST: '{{ .HOST }}'
          PROFILE: '{{ .ITEM }}'

  run:pi4-0002:
    desc: *inspec-run-desc
    vars:
      HOST: pi4-0002.fritz.box
    cmds:
      - for: ['raspi-baseline']
        task: internal:run-profile
        vars:
          HOST: '{{ .HOST }}'
          PROFILE: '{{ .ITEM }}'

  run:pi5-0004:
    desc: *inspec-run-desc
    vars:
      HOST: pi5-0004.fritz.box
    cmds:
      - for: ['raspi-baseline']
        task: internal:run-profile
        vars:
          HOST: '{{ .HOST }}'
          PROFILE: '{{ .ITEM }}'
