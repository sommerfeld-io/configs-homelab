---
version: '3.42.1'

dotenv: ['.env']

vars:
  REPO: https://raw.githubusercontent.com/sommerfeld-io/.github

includes:
  ansible:
    taskfile: ansible/taskfile.yml
    dir: ansible
  cleanup: .task/cleanup/taskfile.yml
  common: .task/common/taskfile.yml
  copilot: .github/skills/taskfile.yml
  inspec: tests/inspec/taskfile.yml

tasks:

  symlinks:
    desc: Create symlinks for shared files
    cmds:
      - ln -sf "$(pwd)/.github/copilot-instructions.md" "$(pwd)/CLAUDE.md"

  bmad:install:
    desc: Install BMad Method (bmm module) for Claude Code if not already present. Use `--force` to update an existing installation.
    status:
      - test -d _bmad
    vars:
      ALLOW_DOWNLOAD: --yes
      BMAD_HEADLESS_INSTALL: --yes
    cmds:
      - npx {{ .ALLOW_DOWNLOAD }} bmad-method install --directory . --modules bmm --tools claude-code {{ .BMAD_HEADLESS_INSTALL }}

  # ===============================================================================================

  lint:
    desc: Run all project linters (except Dockerfile linters)
    cmds:
      - task: inspec:cleanup
      - task: cleanup:filesystem
      - task: symlinks
      - task: docs:generate
      - for: ['yaml', 'filenames', 'folders', 'ansible', 'alloy-config', 'workflows', 'markdown-links']
        cmd: docker compose up lint-{{ .ITEM }} --exit-code-from lint-{{ .ITEM }}

  # ===============================================================================================

  docs:generate:
    desc: 'Generate Markdown files for documentation'
    vars:
      GRAFANA_CLOUD_DOCS: docs/ansible/roles/grafana-cloud
      GRAFANA_CLOUD_SRC: ansible/roles/grafana-cloud
    cmds:
      - echo "Collecting documentation from other Markdown files ..."
      - task: common:copy
        vars: { SRC: docs/index.md, DEST: README.md }
      - task: common:copy
        vars: { SRC: docs/license.md, DEST: LICENSE.md }
      - mkdir -p {{ .GRAFANA_CLOUD_DOCS }}
      - task: common:copy
        vars: { SRC: "{{ .GRAFANA_CLOUD_SRC }}/alloy/README.md", DEST: "{{ .GRAFANA_CLOUD_DOCS }}/alloy.md" }

  docs:run:
    desc: Run the documentation server
    cmds:
      - task: docs:generate
      - docker compose up docs-dev-server
