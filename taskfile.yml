---
version: '3.42.1'

dotenv: ['.env']

vars:
  REPO: https://raw.githubusercontent.com/sommerfeld-io/.github

includes:
  bmad: .task/bmad/taskfile.yml
  cleanup: .task/cleanup/taskfile.yml
  cloud:
    taskfile: configs-cloud/taskfile.yml
    dir: configs-cloud
  common: .task/common/taskfile.yml
  grafana-cloud:
    taskfile: grafana-cloud/opentofu/taskfile.yml
    dir: grafana-cloud/opentofu
  homelab:
    taskfile: configs-homelab/taskfile.yml
    dir: configs-homelab
  vm:
    taskfile: virtual-machines/taskfile.yml
    dir: virtual-machines

tasks:

  compose:pull:
    desc: Pull all container images for linting and validation (exclude the app image)
    cmds:
      - docker compose pull

  symlinks:
    desc: Create symlinks for shared files
    cmds:
      - ln -sf "$(pwd)/.github/copilot-instructions.md" "$(pwd)/CLAUDE.md"

  # Validates every root the validate-opentofu CI job validates (same discovery script): syntax
  # and references, without a token or state. The first validate is quiet; whenever it fails
  # (e.g. the provider cache is missing or does not match the lock file), the root is initialized
  # without a backend. Only that init needs the network, and -lockfile=readonly never rewrites
  # .terraform.lock.hcl. A failed init does not stop the task: the final validate always runs and
  # reports the result.
  opentofu:validate:
    desc: Validate every OpenTofu root module (folder with a tracked versions.tf)
    vars:
      ROOTS:
        sh: .github/workflows/assets/find-opentofu-roots.sh
    cmds:
      - for: { var: ROOTS }
        cmd: |
          echo "tofu validate {{ .ITEM }}"
          tofu -chdir={{ .ITEM }} validate >/dev/null 2>&1 || tofu -chdir={{ .ITEM }} init -backend=false -input=false -lockfile=readonly || true
          tofu -chdir={{ .ITEM }} validate

  # ===============================================================================================

  lint:
    desc: Run all project linters (except Dockerfile linters)
    cmds:
      - task: homelab:inspec:cleanup
      - task: cleanup:filesystem
      - task: symlinks
      - task: docs:generate
      - task: cloud:digital-ocean:opentofu:fmt
      - task: grafana-cloud:fmt
      - task: opentofu:validate
      - for: ['yaml', 'filenames', 'folders', 'ansible', 'opentofu', 'alloy-config', 'workflows', 'markdown-links']
        cmd: docker compose up lint-{{ .ITEM }} --exit-code-from lint-{{ .ITEM }}

  # ===============================================================================================

  docs:generate:
    desc: 'Generate Markdown files for documentation'
    vars:
      ROLES_DOCS: docs/homelab/ansible/roles
      ROLES_SRC: configs-homelab/ansible/roles
      CLOUD_ROLES_DOCS: docs/cloud/ansible/roles
      CLOUD_ROLES_SRC: configs-cloud/digital-ocean/ansible/roles
    cmds:
      - echo "Collecting documentation from other Markdown files ..."
      - task: common:copy
        vars: { SRC: docs/index.md, DEST: README.md }
      - task: common:copy
        vars: { SRC: docs/license.md, DEST: LICENSE.md }
      - mkdir -p {{ .ROLES_DOCS }}/common
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/common/mount-disk/README.md", DEST: "{{ .ROLES_DOCS }}/common/mount-disk.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/common/taskfile-dev/README.md", DEST: "{{ .ROLES_DOCS }}/common/taskfile-dev.md" }
      - mkdir -p {{ .ROLES_DOCS }}/media
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/media/jellyfin/README.md", DEST: "{{ .ROLES_DOCS }}/media/jellyfin.md" }
      - mkdir -p {{ .ROLES_DOCS }}/netaudit
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/netaudit/nmap/README.md", DEST: "{{ .ROLES_DOCS }}/netaudit/nmap.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/netaudit/device_discovery/README.md", DEST: "{{ .ROLES_DOCS }}/netaudit/device-discovery.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/netaudit/service_detection/README.md", DEST: "{{ .ROLES_DOCS }}/netaudit/service-detection.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/netaudit/web_services/README.md", DEST: "{{ .ROLES_DOCS }}/netaudit/web-services.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/netaudit/tls_certificates/README.md", DEST: "{{ .ROLES_DOCS }}/netaudit/tls-certificates.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/netaudit/broadcast_discovery/README.md", DEST: "{{ .ROLES_DOCS }}/netaudit/broadcast-discovery.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/netaudit/report/README.md", DEST: "{{ .ROLES_DOCS }}/netaudit/report.md" }
      - mkdir -p {{ .ROLES_DOCS }}/omarchy
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/omarchy/customizations/README.md", DEST: "{{ .ROLES_DOCS }}/omarchy/customizations.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/omarchy/monitor-config/README.md", DEST: "{{ .ROLES_DOCS }}/omarchy/monitor-config.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/omarchy/snapshot/README.md", DEST: "{{ .ROLES_DOCS }}/omarchy/snapshot.md" }
      - mkdir -p {{ .ROLES_DOCS }}/raspi
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/raspi/pihole/README.md", DEST: "{{ .ROLES_DOCS }}/raspi/pihole.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/raspi/fritz-box-exporter/README.md", DEST: "{{ .ROLES_DOCS }}/raspi/fritz-box-exporter.md" }
      - mkdir -p {{ .ROLES_DOCS }}/grafana-cloud
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/grafana-cloud/alloy/README.md", DEST: "{{ .ROLES_DOCS }}/grafana-cloud/alloy.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/grafana-cloud/exporters/README.md", DEST: "{{ .ROLES_DOCS }}/grafana-cloud/exporters.md" }
      - task: common:copy
        vars: { SRC: "virtual-machines/omarchy/README.md", DEST: "docs/homelab/nodes/omarchy-workstations/vm.md" }
      - mkdir -p {{ .CLOUD_ROLES_DOCS }}
      - for: ['fantasy-hockey', 'motd', 'swap']
        task: common:copy
        vars: { SRC: "{{ .CLOUD_ROLES_SRC }}/{{ .ITEM }}/README.md", DEST: "{{ .CLOUD_ROLES_DOCS }}/{{ .ITEM }}.md" }

  docs:run:
    desc: Run the documentation server
    cmds:
      - task: docs:generate
      - docker compose up docs-dev-server
