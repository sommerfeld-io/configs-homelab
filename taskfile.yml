---
version: '3.42.1'

dotenv: ['.env']

vars:
  REPO: https://raw.githubusercontent.com/sommerfeld-io/.github

includes:
  ansible:
    taskfile: ansible/taskfile.yml
    dir: ansible
  cleanup: .task/cleanup/taskfile.yml
  common: .task/common/taskfile.yml
  inspec: tests/inspec/taskfile.yml
  molecule:
    taskfile: tests/molecule/taskfile.yml
    dir: tests/molecule

tasks:

  compose:pull:
    desc: Pull all container images for linting and validation (exclude the app image)
    cmds:
      - docker compose pull

  symlinks:
    desc: Create symlinks for shared files
    cmds:
      - ln -sf "$(pwd)/.github/copilot-instructions.md" "$(pwd)/CLAUDE.md"

  bmad:install:
    desc: Install BMad Method (bmm module) for Claude Code if not already present. Use `--force` to update an existing installation.
    status:
      - test -d _bmad
    vars:
      ALLOW_DOWNLOAD: --yes
      BMAD_HEADLESS_INSTALL: --yes
    cmds:
      - npx {{ .ALLOW_DOWNLOAD }} bmad-method install --directory . --modules bmm --tools claude-code {{ .BMAD_HEADLESS_INSTALL }}

  # ===============================================================================================

  lint:
    desc: Run all project linters (except Dockerfile linters)
    cmds:
      - task: inspec:cleanup
      - task: cleanup:filesystem
      - task: symlinks
      - task: docs:generate
      - for: ['yaml', 'filenames', 'folders', 'ansible', 'alloy-config', 'workflows', 'markdown-links']
        cmd: docker compose up lint-{{ .ITEM }} --exit-code-from lint-{{ .ITEM }}

  # ===============================================================================================

  docs:generate:
    desc: 'Generate Markdown files for documentation'
    vars:
      ROLES_DOCS: docs/ansible/roles
      ROLES_SRC: ansible/roles
    cmds:
      - echo "Collecting documentation from other Markdown files ..."
      - task: common:copy
        vars: { SRC: docs/index.md, DEST: README.md }
      - task: common:copy
        vars: { SRC: docs/license.md, DEST: LICENSE.md }
      - mkdir -p {{ .ROLES_DOCS }}/common
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/common/mount-disk/README.md", DEST: "{{ .ROLES_DOCS }}/common/mount-disk.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/common/omarchy-customizations/README.md", DEST: "{{ .ROLES_DOCS }}/common/omarchy-customizations.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/common/taskfile-dev/README.md", DEST: "{{ .ROLES_DOCS }}/common/taskfile-dev.md" }
      - mkdir -p {{ .ROLES_DOCS }}/media
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/media/jellyfin/README.md", DEST: "{{ .ROLES_DOCS }}/media/jellyfin.md" }
      - mkdir -p {{ .ROLES_DOCS }}/raspi
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/raspi/pihole/README.md", DEST: "{{ .ROLES_DOCS }}/raspi/pihole.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/raspi/fritz-box-exporter/README.md", DEST: "{{ .ROLES_DOCS }}/raspi/fritz-box-exporter.md" }
      - mkdir -p {{ .ROLES_DOCS }}/grafana-cloud
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/grafana-cloud/alloy/README.md", DEST: "{{ .ROLES_DOCS }}/grafana-cloud/alloy.md" }
      - task: common:copy
        vars: { SRC: "{{ .ROLES_SRC }}/grafana-cloud/exporters/README.md", DEST: "{{ .ROLES_DOCS }}/grafana-cloud/exporters.md" }

  docs:run:
    desc: Run the documentation server
    cmds:
      - task: docs:generate
      - docker compose up docs-dev-server
