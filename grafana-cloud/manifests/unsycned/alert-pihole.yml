---
apiVersion: 1
groups:
  - orgId: 1
    name: pihole
    folder: playground
    interval: 15m
    rules:
      - uid: ffyyc6rxth43kb
        title: Pi-hole Status
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: grafanacloud-prom
            model:
              datasource:
                type: prometheus
                uid: grafanacloud-prom
              expr: count by (name) (container_start_time_seconds{name="pihole"})
              instant: true
              interval: ""
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: ne
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: services-pihole-overview
        panelId: 8
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          __dashboardUid__: services-pihole-overview
          __panelId__: "8"
          description: Alert in case Pi-hole is not up and running
          runbook_url: https://github.com/sommerfeld-io/configs-homelab/blob/main/docs/incidents/runbooks/pihole.md
          summary: Alert in case Pi-hole is not up and running
        labels: {}
        isPaused: false
        notification_settings:
          receiver: grafana-default-email
